<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rondo Rush - Promo 15s (Format 9:16)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-ui: 'Varela Round', system-ui, sans-serif;
      --bg-dark: #090d16;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-ui);
    }

    body {
      background: var(--bg-dark);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .preview-stage {
      position: relative;
      width: 360px;
      height: 640px;
      border-radius: 28px;
      border: 4px solid #0f172a;
      box-shadow: 0 10px 0 #020617, 0 20px 30px rgba(0, 0, 0, 0.6);
      background: #000;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #4ade80;
    }

    .control-panel {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }

    .progress-bar-container {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 8px;
      border: 2px solid #0f172a;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #4ade80;
      transition: width 0.05s linear;
    }

    .status-text {
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="preview-stage">
    <canvas id="trailerCanvas" width="720" height="1280"></canvas>
  </div>

  <div class="control-panel">
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="status-text" id="statusLabel">Prêt pour le rendu (15s)</div>
  </div>

  <script>
    const TOTAL_DURATION = 15.0; // 15.0s pile selon le brief
    const canvas = document.getElementById('trailerCanvas');
    const ctx = canvas.getContext('2d');
    const progressFill = document.getElementById('progressFill');
    const statusLabel = document.getElementById('statusLabel');

    const W = canvas.width;   // 720
    const H = canvas.height;  // 1280

    // --- SYNTHÉTISEUR AUDIO PHONK / ÉLECTRONIQUE (CUT ON BEAT) ---
    class PhonkAudioEngine {
      constructor() {
        this.ctx = null;
        this.dest = null;
        this.audioStream = null;
        this.bpm = 132;
        this.beatInterval = 60 / this.bpm; // ~0.454s par beat
        this.nextBeatTime = 0;
        this.beatCount = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          this.dest = this.ctx.createMediaStreamDestination();
          this.audioStream = this.dest.stream;
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Kick lourd 808
      playKick(time) {
        if (!this.ctx) return;
        const t = time || this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();

        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(38, t + 0.14);

        g.gain.setValueAtTime(0.7, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);

        osc.connect(g);
        g.connect(this.ctx.destination);
        g.connect(this.dest);

        osc.start(t);
        osc.stop(t + 0.22);
      }

      // Snare / Clap tranchant
      playSnare(time) {
        if (!this.ctx) return;
        const t = time || this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.12;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(1200, t);

        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.4, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.12);

        noise.connect(filter);
        filter.connect(g);
        g.connect(this.ctx.destination);
        g.connect(this.dest);

        noise.start(t);
      }

      // Basse Phonk 808
      playBassNote(freq, duration, time) {
        if (!this.ctx) return;
        const t = time || this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, t);

        g.gain.setValueAtTime(0.35, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + duration);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(380, t);

        osc.connect(filter);
        filter.connect(g);
        g.connect(this.ctx.destination);
        g.connect(this.dest);

        osc.start(t);
        osc.stop(t + duration);
      }

      // Bruitage "Pop" satisfaisant pour bouton
      playPop() {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, t);
        osc.frequency.exponentialRampToValueAtTime(840, t + 0.08);

        g.gain.setValueAtTime(0.5, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.08);

        osc.connect(g);
        g.connect(this.ctx.destination);
        g.connect(this.dest);

        osc.start(t);
        osc.stop(t + 0.08);
      }

      // Swoosh de passe rapide
      playSwoosh() {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.exponentialRampToValueAtTime(620, t + 0.1);

        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.12);

        osc.connect(g);
        g.connect(this.ctx.destination);
        g.connect(this.dest);

        osc.start(t);
        osc.stop(t + 0.12);
      }

      // Son validation de combo
      playComboValidation() {
        if (!this.ctx) return;
        [523, 659, 784, 1046].forEach((f, idx) => {
          setTimeout(() => {
            if (!this.ctx) return;
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, t);
            g.gain.setValueAtTime(0.25, t);
            g.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
            osc.connect(g);
            g.connect(this.ctx.destination);
            g.connect(this.dest);
            osc.start(t);
            osc.stop(t + 0.15);
          }, idx * 60);
        });
      }

      // Mise à jour de la rythmique Phonk en continu
      tick(gameTime) {
        if (!this.ctx) return;
        const cur = this.ctx.currentTime;
        if (this.nextBeatTime === 0) {
          this.nextBeatTime = cur;
        }

        while (this.nextBeatTime < cur + 0.1) {
          const beatInBar = this.beatCount % 4;

          // Kick sur les temps 0 et 2
          if (beatInBar === 0 || beatInBar === 2) {
            this.playKick(this.nextBeatTime);
          }
          // Snare sur les temps 1 et 3
          if (beatInBar === 1 || beatInBar === 3) {
            this.playSnare(this.nextBeatTime);
          }

          // Ligne de basse Phonk (gamme mineure énergique)
          const bassNotes = [55, 55, 65.4, 49]; // A1, A1, C2, G1
          const note = bassNotes[Math.floor(this.beatCount / 2) % bassNotes.length];
          this.playBassNote(note, this.beatInterval * 0.9, this.nextBeatTime);

          this.nextBeatTime += this.beatInterval;
          this.beatCount++;
        }
      }
    }

    const audio = new PhonkAudioEngine();

    // Entités du rondo (5 joueurs, 1 taureau, 1 ballon)
    const centerX = W / 2;
    const centerY = H / 2 + 10;
    const rondoRadius = 240;

    let players = [];
    for (let i = 0; i < 5; i++) {
      const angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
      players.push({
        idx: i,
        angle: angle,
        x: centerX + Math.cos(angle) * rondoRadius,
        y: centerY + Math.sin(angle) * rondoRadius
      });
    }

    let bull = {
      x: centerX,
      y: centerY,
      speed: 260
    };

    let ball = {
      x: players[0].x,
      y: players[0].y,
      carrierIdx: 0,
      inFlight: false,
      fromX: players[0].x,
      fromY: players[0].y,
      toX: players[0].x,
      toY: players[0].y,
      progress: 1.0
    };

    let aimVector = {
      visible: false,
      fromX: 0, fromY: 0,
      toX: 0, toY: 0
    };

    let screenShake = 0;
    let score = 0;

    // Timeline des passes rapides [00:03 - 00:08]
    const GAMEPLAY_PASSES = [
      { t: 3.3, aim: 3.1, from: 0, to: 2 },
      { t: 3.9, aim: 3.7, from: 2, to: 4 },
      { t: 4.5, aim: 4.3, from: 4, to: 1 },
      { t: 5.1, aim: 4.9, from: 1, to: 3 },
      { t: 5.7, aim: 5.5, from: 3, to: 0 },
      { t: 6.3, aim: 6.1, from: 0, to: 2 },
      { t: 6.9, aim: 6.7, from: 2, to: 4 },
      { t: 7.5, aim: 7.3, from: 4, to: 1 }
    ];

    let passedIndex = 0;

    // --- MOTEUR DE DESSIN ---
    function render(t) {
      ctx.save();

      // Application du screen shake
      if (screenShake > 0) {
        const shakeX = (Math.random() - 0.5) * screenShake;
        const shakeY = (Math.random() - 0.5) * screenShake;
        ctx.translate(shakeX, shakeY);
        screenShake = Math.max(0, screenShake - 0.8);
      }

      ctx.clearRect(0, 0, W, H);

      if (t < 3.0) {
        // [00:00 - 00:03] LE HOOK (L'invitation)
        renderScene1_Hook(t);
      } else if (t < 8.0) {
        // [00:03 - 00:08] LE GAMEPLAY (La tension)
        renderScene2_Gameplay(t);
      } else if (t < 12.0) {
        // [00:08 - 00:12] LA RÉCOMPENSE (La progression)
        renderScene3_Shop(t);
      } else {
        // [00:12 - 00:15] LE CALL TO ACTION (L'installation)
        renderScene4_CTA(t);
      }

      ctx.restore();
    }

    // =========================================================================
    // SCÈNE 1 : LE HOOK [00:00 - 00:03]
    // =========================================================================
    function renderScene1_Hook(t) {
      // Fond vert officiel
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(0, 0, W, H);

      // Motif terrain rondo en arrière-plan
      ctx.strokeStyle = '#bbf7d0';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(centerX, centerY + 80, 240, 0, Math.PI * 2);
      ctx.stroke();

      // Carte centrale du menu d'accueil
      const cardY = 220;
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      roundRect(ctx, 45, cardY, W - 90, 680, 28);
      ctx.fill();
      ctx.stroke();

      // Taureau icône
      drawBullHead(W / 2, cardY + 110, 65);

      // Titre Rondo Rush
      ctx.textAlign = 'center';
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 52px "Varela Round"';
      ctx.fillText('RONDO RUSH', W / 2, cardY + 230);

      // Sous-titre
      ctx.font = '800 18px "Varela Round"';
      ctx.fillStyle = '#16a34a';
      ctx.fillText('PLAYFUL FLAT EDITION', W / 2, cardY + 265);

      // Badges record & étoiles
      roundRect(ctx, 80, cardY + 300, 240, 50, 16);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#64748b';
      ctx.font = '800 14px "Varela Round"';
      ctx.fillText('RECORD : 42', 200, cardY + 332);

      roundRect(ctx, W - 320, cardY + 300, 240, 50, 16);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#f59e0b';
      ctx.fillText('ÉTOILES : 150', W - 200, cardY + 332);

      // Bouton vert "JOUER !" avec physique d'enfoncement (CSS hard-shadow)
      const btnPress = t >= 1.6 && t < 2.8;
      const btnY = cardY + 390 + (btnPress ? 8 : 0);
      const shadowH = btnPress ? 0 : 8;

      // Ombre solide
      if (shadowH > 0) {
        ctx.fillStyle = '#0f172a';
        roundRect(ctx, 90, btnY + shadowH, W - 180, 85, 22);
        ctx.fill();
      }

      // Corps du bouton
      ctx.fillStyle = '#4ade80';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      roundRect(ctx, 90, btnY, W - 180, 85, 22);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.font = '900 36px "Varela Round"';
      ctx.fillText('JOUER !', W / 2, btnY + 54);

      // Bouton Boutique secondaire
      ctx.fillStyle = '#fbbf24';
      roundRect(ctx, 90, cardY + 510, W - 180, 70, 20);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 24px "Varela Round"';
      ctx.fillText('BOUTIQUE', W / 2, cardY + 554);

      ctx.restore();

      // Doigt / Pouce virtuel qui vient appuyer
      let fingerY = 1200;
      if (t >= 0.8 && t < 1.6) {
        const p = (t - 0.8) / 0.8;
        fingerY = 1200 - (1200 - (btnY + 65)) * p;
      } else if (t >= 1.6 && t < 2.8) {
        fingerY = btnY + 65;
      } else if (t >= 2.8) {
        fingerY = 1200;
      }
      drawVirtualFinger(W / 2 + 30, fingerY, btnPress);

      // Éclair pop sonore déclenché à 1.6s
      if (t >= 1.58 && t < 1.65 && !window.hookPopped) {
        audio.playPop();
        window.hookPopped = true;
      }

      // Gros texte animé : "TESTE TES RÉFLEXES !"
      const bannerScale = 1.0 + Math.sin(t * 12) * 0.05;
      ctx.save();
      ctx.translate(W / 2, 120);
      ctx.scale(bannerScale, bannerScale);

      ctx.fillStyle = '#fbbf24';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      roundRect(ctx, -260, -42, 520, 84, 22);
      ctx.fill();
      ctx.stroke();

      // Texte + Éclair
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 28px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('TESTE TES RÉFLEXES !', 0, 0);

      // Éclair Playful Flat
      drawLightningBolt(215, 0, 26);
      drawLightningBolt(-215, 0, 26);

      ctx.restore();
    }

    // =========================================================================
    // SCÈNE 2 : LE GAMEPLAY [00:03 - 00:08]
    // =========================================================================
    function renderScene2_Gameplay(t) {
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(0, 0, W, H);

      // Cercle de terrain
      ctx.strokeStyle = '#bbf7d0';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(centerX, centerY, rondoRadius, 0, Math.PI * 2);
      ctx.stroke();

      // HUD supérieur
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 5;
      roundRect(ctx, 50, 60, 200, 72, 18);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#64748b';
      ctx.font = '800 14px "Varela Round"';
      ctx.fillText('PASSES', 80, 86);
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 32px "Varela Round"';
      ctx.fillText(score.toString(), 80, 118);

      roundRect(ctx, W - 250, 60, 200, 72, 18);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#f59e0b';
      ctx.font = '800 14px "Varela Round"';
      ctx.fillText('VITESSE', W - 220, 86);
      ctx.fillStyle = '#dc2626';
      ctx.font = '900 28px "Varela Round"';
      ctx.fillText('EXTRÊME', W - 220, 118);
      ctx.restore();

      // Gros texte : "LE TAUREAU NE S'ARRÊTE JAMAIS 🐂"
      ctx.save();
      ctx.fillStyle = '#ef4444';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      roundRect(ctx, W / 2 - 270, 150, 540, 60, 18);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 22px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("LE TAUREAU NE S'ARRÊTE JAMAIS !", W / 2, 180);
      ctx.restore();

      // Traitement des passes rapides
      if (passedIndex < GAMEPLAY_PASSES.length) {
        const ev = GAMEPLAY_PASSES[passedIndex];
        // Vecteur de visée cyan
        if (t >= ev.aim && t < ev.t) {
          aimVector.visible = true;
          aimVector.fromX = players[ev.from].x;
          aimVector.fromY = players[ev.from].y;
          aimVector.toX = players[ev.to].x;
          aimVector.toY = players[ev.to].y;
        } else {
          aimVector.visible = false;
        }

        if (t >= ev.t && !ball.inFlight) {
          ball.fromX = players[ev.from].x;
          ball.fromY = players[ev.from].y;
          ball.toX = players[ev.to].x;
          ball.toY = players[ev.to].y;
          ball.carrierIdx = ev.to;
          ball.progress = 0;
          ball.inFlight = true;
          audio.playSwoosh();
        }
      }

      // Ballon en vol
      if (ball.inFlight) {
        ball.progress += 0.08;
        if (ball.progress >= 1.0) {
          ball.progress = 1.0;
          ball.inFlight = false;
          ball.x = ball.toX;
          ball.y = ball.toY;
          score += 3; // Augmentation rapide du score
          screenShake = 14; // Screen shake léger à chaque réception !
          audio.playComboValidation();
          passedIndex++;
        } else {
          ball.x = ball.fromX + (ball.toX - ball.fromX) * ball.progress;
          ball.y = ball.fromY + (ball.toY - ball.fromY) * ball.progress;
        }
      }

      // Taureau qui charge de plus en plus vite
      const targetX = ball.inFlight ? ball.x : players[ball.carrierIdx].x;
      const targetY = ball.inFlight ? ball.y : players[ball.carrierIdx].y;
      const bSpeed = 0.08 + (t - 3.0) * 0.02;
      bull.x += (targetX - bull.x) * bSpeed;
      bull.y += (targetY - bull.y) * bSpeed;

      // Affichage du vecteur de visée cyan rapide
      if (aimVector.visible) {
        ctx.save();
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 8;
        ctx.setLineDash([14, 12]);
        ctx.beginPath();
        ctx.moveTo(aimVector.fromX, aimVector.fromY);
        ctx.lineTo(aimVector.toX, aimVector.toY);
        ctx.stroke();

        // Tête de flèche
        ctx.fillStyle = '#06b6d4';
        ctx.beginPath();
        ctx.arc(aimVector.toX, aimVector.toY, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Dessin des 5 joueurs
      players.forEach((p, idx) => {
        const isCarrier = (idx === ball.carrierIdx && !ball.inFlight);
        drawPlayerNode(p.x, p.y, isCarrier);
      });

      // Dessin du taureau rouge furieux
      drawAngryChargingBull(bull.x, bull.y, t);

      // Dessin du ballon
      drawBall(ball.x, ball.y);
    }

    // =========================================================================
    // SCÈNE 3 : LA RÉCOMPENSE [00:08 - 00:12]
    // =========================================================================
    function renderScene3_Shop(t) {
      // Effet de balayage transition à 8.0s
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);

      // En-tête Boutique
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fbbf24';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      ctx.font = '900 40px "Varela Round"';
      ctx.strokeText('BOUTIQUE OFFICIELLE', W / 2, 110);
      ctx.fillText('BOUTIQUE OFFICIELLE', W / 2, 110);

      // Solde d'étoiles
      roundRect(ctx, W / 2 - 130, 140, 260, 48, 16);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#f59e0b';
      ctx.font = '900 20px "Varela Round"';
      ctx.fillText('SOLDE : 450 ÉTOILES', W / 2, 172);
      ctx.restore();

      // Onglets
      const tabs = ['TAUREAUX', 'MAILLOTS', 'TERRAINS'];
      tabs.forEach((tab, i) => {
        const x = 50 + i * 215;
        ctx.save();
        ctx.fillStyle = (i === 0) ? '#fbbf24' : '#1e293b';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        roundRect(ctx, x, 210, 200, 50, 14);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = (i === 0) ? '#0f172a' : '#94a3b8';
        ctx.font = '900 16px "Varela Round"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tab, x + 100, 235);
        ctx.restore();
      });

      // Défilement de la liste des taureaux
      const scrollOffset = Math.min((t - 8.0) * 140, 180);
      const skins = [
        { name: 'CYBORG LASER', color: '#0284c7', price: 'DÉBLOQUÉ', equipped: false },
        { name: 'TAUREAU TOXIQUE', color: '#16a34a', price: 'DÉBLOQUÉ', equipped: false },
        { name: 'TAUREAU MAGMA', color: '#ea580c', price: '150 ÉTOILES', equipped: false, isTarget: true },
        { name: 'TAUREAU DORÉ', color: '#f59e0b', price: '300 ÉTOILES', equipped: false }
      ];

      // À 10.2s : achat et équipement du Taureau Magma
      const isPurchased = t >= 10.2;
      if (t >= 10.18 && t < 10.25 && !window.magmaBought) {
        audio.playComboValidation();
        window.magmaBought = true;
      }

      skins.forEach((s, idx) => {
        const row = idx;
        const cardY = 280 + row * 160 - scrollOffset;

        if (cardY < 180 || cardY > 1050) return;

        ctx.save();
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = (s.isTarget && isPurchased) ? '#4ade80' : '#0f172a';
        ctx.lineWidth = (s.isTarget && isPurchased) ? 6 : 4;
        roundRect(ctx, 50, cardY, W - 100, 140, 20);
        ctx.fill();
        ctx.stroke();

        // Miniature
        ctx.fillStyle = s.color;
        roundRect(ctx, 70, cardY + 15, 110, 110, 16);
        ctx.fill();
        ctx.stroke();
        drawBullHead(125, cardY + 70, 36);

        // Titre
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 22px "Varela Round"';
        ctx.textAlign = 'left';
        ctx.fillText(s.name, 205, cardY + 55);

        // Bouton Acheter / Équipé
        let label = s.price;
        let btnCol = '#fbbf24';
        if (s.isTarget && isPurchased) {
          label = 'ÉQUIPÉ !';
          btnCol = '#4ade80';
        }

        ctx.fillStyle = btnCol;
        roundRect(ctx, 205, cardY + 75, 200, 44, 12);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.font = '900 16px "Varela Round"';
        ctx.textAlign = 'center';
        ctx.fillText(label, 305, cardY + 103);

        ctx.restore();
      });

      // Texte animé en bas : "DÉBLOQUE DES SKINS ÉPIQUES ✨"
      ctx.save();
      ctx.fillStyle = '#4ade80';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      roundRect(ctx, 50, H - 180, W - 100, 80, 22);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.font = '900 26px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('DÉBLOQUE DES SKINS ÉPIQUES !', W / 2, H - 140);
      ctx.restore();
    }

    // =========================================================================
    // SCÈNE 4 : LE CALL TO ACTION [00:12 - 00:15]
    // =========================================================================
    function renderScene4_CTA(t) {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);

      // Écran de Game Over avec score énorme
      ctx.save();
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      roundRect(ctx, 45, 120, W - 90, 580, 28);
      ctx.fill();
      ctx.stroke();

      // Titre Game Over
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ef4444';
      ctx.font = '900 48px "Varela Round"';
      ctx.fillText('FIN DE PARTIE', W / 2, 210);

      // Score énorme
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 22px "Varela Round"';
      ctx.fillText('SCORE FINAL', W / 2, 265);

      ctx.fillStyle = '#fbbf24';
      ctx.font = '900 78px "Varela Round"';
      ctx.fillText('38', W / 2, 345);

      ctx.fillStyle = '#4ade80';
      ctx.font = '900 24px "Varela Round"';
      ctx.fillText('NOUVEAU RECORD !', W / 2, 400);

      // Bouton INSTALLER L'APPLICATION ciblé
      const btnInstallPress = t >= 13.5;
      const bY = 480 + (btnInstallPress ? 6 : 0);
      const bShadow = btnInstallPress ? 0 : 6;

      if (bShadow > 0) {
        ctx.fillStyle = '#020617';
        roundRect(ctx, 80, bY + bShadow, W - 160, 80, 20);
        ctx.fill();
      }

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 5;
      roundRect(ctx, 80, bY, W - 160, 80, 20);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.font = '900 22px "Varela Round"';
      ctx.fillText("INSTALLER L'APPLICATION", W / 2, bY + 48);

      ctx.restore();

      // Doigt qui clique sur "INSTALLER L'APPLICATION"
      let ctaFingerY = 1200;
      if (t >= 12.6 && t < 13.5) {
        const p = (t - 12.6) / 0.9;
        ctaFingerY = 1200 - (1200 - (bY + 50)) * p;
      } else if (t >= 13.5) {
        ctaFingerY = bY + 50;
      }
      drawVirtualFinger(W / 2 + 30, ctaFingerY, btnInstallPress);

      if (t >= 13.48 && t < 13.55 && !window.installPopped) {
        audio.playPop();
        window.installPopped = true;
      }

      // STICKER FINAL & CALL TO ACTION
      ctx.save();
      ctx.fillStyle = '#fbbf24';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      roundRect(ctx, 40, H - 360, W - 80, 180, 24);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.font = '900 28px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.fillText('JOUE GRATUITEMENT DANS', W / 2, H - 305);
      ctx.fillText('TON NAVIGATEUR !', W / 2, H - 265);

      ctx.font = '800 18px "Varela Round"';
      ctx.fillStyle = '#1e293b';
      ctx.fillText('IPHONE & ANDROID - SANS TÉLÉCHARGEMENT', W / 2, H - 215);

      // URL en bas
      ctx.fillStyle = '#4ade80';
      ctx.font = '900 30px "Varela Round"';
      ctx.fillText('rando-rush.onrender.com', W / 2, H - 100);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '800 18px "Varela Round"';
      ctx.fillText('LIEN EN BIO', W / 2, H - 60);

      ctx.restore();
    }

    // --- UTILITAIRES GRAPHIQUES ---

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawLightningBolt(x, y, size) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#fef08a';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(-size * 0.4, -size * 0.1);
      ctx.lineTo(0, -size * 0.1);
      ctx.lineTo(-size * 0.2, size);
      ctx.lineTo(size * 0.5, 0);
      ctx.lineTo(size * 0.1, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawVirtualFinger(x, y, pressed) {
      ctx.save();
      ctx.translate(x, y);
      const sc = pressed ? 0.92 : 1.0;
      ctx.scale(sc, sc);

      // Pouce stylisé flat
      ctx.fillStyle = '#fbcfe8';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      roundRect(ctx, -26, 0, 52, 110, 26);
      ctx.fill();
      ctx.stroke();

      // Ondulation de tap
      if (pressed) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 20, 48, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawBullHead(x, y, r) {
      ctx.save();
      ctx.translate(x, y);

      // Cornes
      ctx.fillStyle = '#f59e0b';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      // Corne G
      ctx.beginPath();
      ctx.moveTo(-r * 0.5, -r * 0.2);
      ctx.quadraticCurveTo(-r * 1.1, -r * 0.9, -r * 0.6, -r * 1.3);
      ctx.quadraticCurveTo(-r * 0.4, -r * 0.8, -r * 0.2, -r * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Corne D
      ctx.beginPath();
      ctx.moveTo(r * 0.5, -r * 0.2);
      ctx.quadraticCurveTo(r * 1.1, -r * 0.9, r * 0.6, -r * 1.3);
      ctx.quadraticCurveTo(r * 0.4, -r * 0.8, r * 0.2, -r * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Tête
      ctx.fillStyle = '#fb7185';
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Yeux
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-r * 0.35, -r * 0.1, r * 0.22, 0, Math.PI * 2);
      ctx.arc(r * 0.35, -r * 0.1, r * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-r * 0.3, -r * 0.1, r * 0.1, 0, Math.PI * 2);
      ctx.arc(r * 0.3, -r * 0.1, r * 0.1, 0, Math.PI * 2);
      ctx.fill();

      // Anneau doré
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, r * 0.55, r * 0.28, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function drawAngryChargingBull(x, y, t) {
      ctx.save();
      ctx.translate(x, y);

      // Ombre
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 48, 42, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      // Corps Taureau Rouge
      ctx.fillStyle = '#dc2626';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(0, 0, 48, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Cornes en feu
      ctx.fillStyle = '#ef4444';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-32, -22);
      ctx.quadraticCurveTo(-58, -55, -34, -75);
      ctx.quadraticCurveTo(-26, -50, -14, -38);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(32, -22);
      ctx.quadraticCurveTo(58, -55, 34, -75);
      ctx.quadraticCurveTo(26, -50, 14, -38);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Yeux jaunes furieux
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(-18, -6, 11, 0, Math.PI * 2);
      ctx.arc(18, -6, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-16, -6, 5, 0, Math.PI * 2);
      ctx.arc(16, -6, 5, 0, Math.PI * 2);
      ctx.fill();

      // Anneau
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 28, 14, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function drawPlayerNode(x, y, isCarrier) {
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 36, 28, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      if (isCarrier) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(0, 0, 48, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = '#38bdf8';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(0, 0, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 20px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('10', 0, 2);

      ctx.restore();
    }

    function drawBall(x, y) {
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 16, 14, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // --- PIPELINE D'ENREGISTREMENT 15 SECONDES ---
    let currentPlayTime = 0;
    let mediaRecorder = null;
    let recordedChunks = [];

    async function startRecording() {
      audio.init();
      currentPlayTime = 0;
      passedIndex = 0;
      score = 0;

      const videoStream = canvas.captureStream(60);
      const combinedTracks = [
        ...videoStream.getVideoTracks(),
        ...audio.audioStream.getAudioTracks()
      ];
      const combinedStream = new MediaStream(combinedTracks);

      let mimeType = 'video/webm;codecs=vp9,opus';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = 'video/webm';
      }

      recordedChunks = [];
      mediaRecorder = new MediaRecorder(combinedStream, {
        mimeType: mimeType,
        videoBitsPerSecond: 8000000
      });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        blob.arrayBuffer().then(buf => {
          fetch('/save-video-15s', {
            method: 'POST',
            body: buf,
            headers: { 'Content-Type': 'application/octet-stream' }
          }).then(() => {
            statusLabel.innerHTML = 'Vidéo 15s capturée avec succès.';
          });
        });
      };

      mediaRecorder.start();

      let lastTime = performance.now();

      function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.04);
        lastTime = now;

        currentPlayTime += dt;
        audio.tick(currentPlayTime);

        render(currentPlayTime);

        const progressPercent = Math.min((currentPlayTime / TOTAL_DURATION) * 100, 100);
        progressFill.style.width = `${progressPercent}%`;
        statusLabel.innerHTML = `Génération 15s : ${currentPlayTime.toFixed(1)}s / 15.0s`;

        if (currentPlayTime < TOTAL_DURATION) {
          requestAnimationFrame(loop);
        } else {
          mediaRecorder.stop();
        }
      }

      requestAnimationFrame(loop);
    }

    render(0);

    if (window.location.search.includes('auto=1')) {
      setTimeout(() => {
        startRecording();
      }, 600);
    }
  </script>
