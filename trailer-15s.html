<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rondo Rush - Promo 15s (Fidélité 100% au jeu réel)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-ui: 'Varela Round', system-ui, sans-serif;
      --bg-dark: #090d16;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-ui); }
    body {
      background: var(--bg-dark);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .preview-stage {
      position: relative;
      width: 360px;
      height: 640px;
      border-radius: 28px;
      border: 4px solid #0f172a;
      box-shadow: 0 10px 0 #020617, 0 20px 30px rgba(0, 0, 0, 0.6);
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #4ade80;
    }
    .control-panel {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }
    .progress-bar-container {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 8px;
      border: 2px solid #0f172a;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #4ade80;
      transition: width 0.05s linear;
    }
    .status-text {
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="preview-stage">
    <canvas id="trailerCanvas" width="720" height="1280"></canvas>
  </div>

  <div class="control-panel">
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="status-text" id="statusLabel">Prêt pour le rendu (15s)</div>
  </div>

  <script>
    const TOTAL_DURATION = 15.0;
    const canvas = document.getElementById('trailerCanvas');
    const ctx = canvas.getContext('2d');
    const progressFill = document.getElementById('progressFill');
    const statusLabel = document.getElementById('statusLabel');

    const W = canvas.width;   // 720
    const H = canvas.height;  // 1280

    // Constantes et géométrie du terrain réel Rondo Rush
    const centerX = W / 2;
    const centerY = H / 2 + 35;
    const rondoRadius = 240;

    // Entités 100% fidèles au jeu réel
    let players = [];
    for (let i = 0; i < 5; i++) {
      const angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
      players.push({
        id: i,
        angle: angle,
        x: centerX + Math.cos(angle) * rondoRadius,
        y: centerY + Math.sin(angle) * rondoRadius,
        radius: 40,
        bounceY: 0,
        eyeX: 0,
        eyeY: 0
      });
    }

    let bull = {
      x: centerX,
      y: centerY,
      radius: 48,
      isAngry: false,
      eyeX: 0,
      eyeY: 0
    };

    let ball = {
      x: players[0].x,
      y: players[0].y,
      carrierIdx: 0,
      inFlight: false,
      fromX: players[0].x,
      fromY: players[0].y,
      toX: players[0].x,
      toY: players[0].y,
      progress: 1.0,
      radius: 18
    };

    let flatPuffs = [];
    let nostrilPuffs = [];
    let screenShake = 0;
    let score = 0;
    let isAiming = false;
    let aimStart = { x: 0, y: 0 };
    let aimEnd = { x: 0, y: 0 };

    // --- MOTEUR AUDIO PHONK & SOUND DESIGN DU VRAI JEU ---
    class PhonkAudio {
      constructor() {
        this.ctx = null;
        this.dest = null;
        this.audioStream = null;
        this.bpm = 132;
        this.beatSec = 60 / this.bpm;
        this.nextBeat = 0;
        this.beatCount = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.dest = this.ctx.createMediaStreamDestination();
          this.audioStream = this.dest.stream;
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      playKick(t) {
        if (!this.ctx) return;
        const now = t || this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(36, now + 0.16);
        g.gain.setValueAtTime(0.75, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(g);
        g.connect(this.ctx.destination);
        g.connect(this.dest);
        osc.start(now);
        osc.stop(now + 0.22);
      }

      playSnare(t) {
        if (!this.ctx) return;
        const now = t || this.ctx.currentTime;
        const bufSize = this.ctx.sampleRate * 0.12;
        const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.22));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(1200, now);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.45, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        noise.connect(filter);
        filter.connect(g);
        g.connect(this.ctx.destination);
        g.connect(this.dest);
        noise.start(now);
      }

      playBass(freq, dur, t) {
        if (!this.ctx) return;
        const now = t || this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(0.35, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + dur);
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(420, now);
        osc.connect(filter);
        filter.connect(g);
        g.connect(this.ctx.destination);
        g.connect(this.dest);
        osc.start(now);
        osc.stop(now + dur);
      }

      // Clik pop satisfaisant pour bouton
      playPop() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
        g.gain.setValueAtTime(0.5, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(g);
        g.connect(this.ctx.destination);
        g.connect(this.dest);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      // Passe du vrai jeu
      playPass(streak = 1) {
        if (!this.ctx) return;
        const freqs = [330, 392, 440, 523, 587, 659, 784, 880];
        const f = freqs[(streak - 1) % freqs.length];
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.4, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(g);
        g.connect(this.ctx.destination);
        g.connect(this.dest);
        osc.start(now);
        osc.stop(now + 0.16);
      }

      // Achat / validation boutique
      playPurchase() {
        if (!this.ctx) return;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
          setTimeout(() => {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now);
            g.gain.setValueAtTime(0.28, now);
            g.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
            osc.connect(g);
            g.connect(this.ctx.destination);
            g.connect(this.dest);
            osc.start(now);
            osc.stop(now + 0.14);
          }, idx * 60);
        });
      }

      tick() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        if (this.nextBeat === 0) this.nextBeat = now;
        while (this.nextBeat < now + 0.1) {
          const beatInBar = this.beatCount % 4;
          if (beatInBar === 0 || beatInBar === 2) this.playKick(this.nextBeat);
          if (beatInBar === 1 || beatInBar === 3) this.playSnare(this.nextBeat);

          const bassNotes = [55, 55, 65.4, 49];
          const note = bassNotes[Math.floor(this.beatCount / 2) % bassNotes.length];
          this.playBass(note, this.beatSec * 0.9, this.nextBeat);

          this.nextBeat += this.beatSec;
          this.beatCount++;
        }
      }
    }

    const audio = new PhonkAudio();

    // Timeline des passes rapides du brief [00:03 - 00:08]
    const PASSES = [
      { t: 3.4, aim: 3.2, from: 0, to: 2 },
      { t: 4.0, aim: 3.8, from: 2, to: 4 },
      { t: 4.6, aim: 4.4, from: 4, to: 1 },
      { t: 5.2, aim: 5.0, from: 1, to: 3 },
      { t: 5.8, aim: 5.6, from: 3, to: 0 },
      { t: 6.4, aim: 6.2, from: 0, to: 2 },
      { t: 7.0, aim: 6.8, from: 2, to: 4 },
      { t: 7.6, aim: 7.4, from: 4, to: 1 }
    ];
    let passIdx = 0;

    // =========================================================================
    // RENDU GRAPHIQUE 100% CONFORME AU VRAI JEU RONDO RUSH
    // =========================================================================
    function render(t) {
      ctx.save();

      // Screen shake
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake = Math.max(0, screenShake - 1.2);
      }

      ctx.clearRect(0, 0, W, H);

      // Fond officiel du terrain Rondo Rush
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(0, 0, W, H);

      // Dessin du vrai terrain
      renderPitchReal();

      // Dessin des vrais joueurs Rondo Rush
      players.forEach((p, idx) => {
        const isCarrier = (idx === ball.carrierIdx && !ball.inFlight);
        renderPlayerReal(p, isCarrier, t);
      });

      // Dessin du vrai Taureau Rondo Rush (ou Taureau Magma en scène 4)
      const isMagma = t >= 10.2;
      renderBullReal(bull.x, bull.y, bull.isAngry, isMagma, t);

      // Trajectoire de visée cyan du vrai jeu
      if (isAiming) {
        renderAimArrowReal(aimStart.x, aimStart.y, aimEnd.x, aimEnd.y);
      }

      // Dessin du vrai ballon
      renderBallReal(ball.x, ball.y);

      // Particules Playful Flat
      renderPuffs();

      // HUD supérieur officiel du vrai jeu
      renderHUDReal(t);

      // --- DÉCOUPAGE CHORÉGRAPHIÉ DU BRIEF ---
      if (t < 3.0) {
        // [00:00 - 00:03] LE HOOK : Menu d'accueil officiel + Doigt appuie sur "JOUER !" + "Test tes réflexes ! ⚡"
        renderOverlayHook(t);
      } else if (t < 8.0) {
        // [00:03 - 00:08] LE GAMEPLAY : Passes ultra-rapides + Screen Shake + "Le Taureau ne s'arrête JAMAIS 🐂"
        renderBannerGameplay(t);
      } else if (t < 12.0) {
        // [00:08 - 00:12] LA RÉCOMPENSE : Vraie Boutique + Défilement + Achat Taureau Magma + "Débloque des skins épiques ✨"
        renderOverlayShop(t);
      } else {
        // [00:12 - 00:15] LE CALL TO ACTION : Game Over officiel + Doigt appuie sur "INSTALLER L'APPLICATION" + Sticker final
        renderOverlayCTA(t);
      }

      ctx.restore();
    }

    // --- 1. PELOUSE & LIGNES DU VRAI JEU ---
    function renderPitchReal() {
      // Grand cercle
      ctx.beginPath();
      ctx.arc(centerX, centerY, rondoRadius, 0, Math.PI * 2);
      ctx.strokeStyle = '#bbf7d0';
      ctx.lineWidth = 5;
      ctx.stroke();

      // Point central
      ctx.beginPath();
      ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#bbf7d0';
      ctx.fill();

      // Cercle technique central
      ctx.beginPath();
      ctx.arc(centerX, centerY, 36, 0, Math.PI * 2);
      ctx.strokeStyle = '#bbf7d0';
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    // --- 2. PASSEURS REELS PLAYFUL FLAT DU JEU ---
    function renderPlayerReal(p, isCarrier, t) {
      const drawY = p.y + p.bounceY;

      // Ombre solide noire décalée
      ctx.beginPath();
      ctx.arc(p.x, drawY + 6, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      // Halo blanc si porteur
      if (isCarrier) {
        ctx.beginPath();
        ctx.arc(p.x, drawY, p.radius + 10, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.stroke();
      }

      // Corps / Maillot bleu cyan officiel
      ctx.beginPath();
      ctx.arc(p.x, drawY, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#38bdf8';
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 5;
      ctx.stroke();

      // Col / Liseré
      ctx.beginPath();
      ctx.arc(p.x, drawY - p.radius * 0.4, p.radius * 0.45, 0, Math.PI);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Yeux cartoon qui regardent vers le ballon
      const dxB = ball.x - p.x;
      const dyB = ball.y - p.y;
      const distB = Math.hypot(dxB, dyB) || 1;
      const eyeOffsetX = (dxB / distB) * 4;
      const eyeOffsetY = (dyB / distB) * 4;

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x - 9 + eyeOffsetX, drawY - 4 + eyeOffsetY, 6, 0, Math.PI * 2);
      ctx.arc(p.x + 9 + eyeOffsetX, drawY - 4 + eyeOffsetY, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#0f172a';
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(p.x - 9 + eyeOffsetX * 1.3, drawY - 4 + eyeOffsetY * 1.3, 3, 0, Math.PI * 2);
      ctx.arc(p.x + 9 + eyeOffsetX * 1.3, drawY - 4 + eyeOffsetY * 1.3, 3, 0, Math.PI * 2);
      ctx.fill();

      // Numéro de maillot
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 20px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText((p.id + 1).toString(), p.x, drawY + 12);
    }

    // --- 3. LE TAUREAU REEL PLAYFUL FLAT DU JEU ---
    function renderBullReal(x, y, isAngry, isMagma, t) {
      ctx.save();
      ctx.translate(x, y);

      // Ombre solide
      ctx.beginPath();
      ctx.arc(0, 8, bull.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      // Corps (Corail classique, Rouge furieux ou Magma en fusion)
      let bodyColor = '#fb7185';
      let hornColor = '#f59e0b';
      if (isAngry) {
        bodyColor = '#dc2626';
        hornColor = '#ef4444';
      }
      if (isMagma) {
        bodyColor = '#ea580c';
        hornColor = '#fbbf24';
      }

      ctx.beginPath();
      ctx.arc(0, 0, bull.radius, 0, Math.PI * 2);
      ctx.fillStyle = bodyColor;
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      ctx.stroke();

      // Cornes courbes fidèles au vrai jeu
      ctx.fillStyle = hornColor;
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      // Corne gauche
      ctx.beginPath();
      ctx.moveTo(-bull.radius * 0.5, -bull.radius * 0.3);
      ctx.quadraticCurveTo(-bull.radius * 1.25, -bull.radius * 0.8, -bull.radius * 0.7, -bull.radius * 1.35);
      ctx.quadraticCurveTo(-bull.radius * 0.45, -bull.radius * 0.85, -bull.radius * 0.2, -bull.radius * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Corne droite
      ctx.beginPath();
      ctx.moveTo(bull.radius * 0.5, -bull.radius * 0.3);
      ctx.quadraticCurveTo(bull.radius * 1.25, -bull.radius * 0.8, bull.radius * 0.7, -bull.radius * 1.35);
      ctx.quadraticCurveTo(bull.radius * 0.45, -bull.radius * 0.85, bull.radius * 0.2, -bull.radius * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Yeux cartoon féroces
      const dxB = ball.x - x;
      const dyB = ball.y - y;
      const distB = Math.hypot(dxB, dyB) || 1;
      const eyeOX = (dxB / distB) * 5;
      const eyeOY = (dyB / distB) * 5;

      ctx.fillStyle = isAngry || isMagma ? '#fef08a' : '#ffffff';
      ctx.beginPath();
      ctx.arc(-16 + eyeOX, -6 + eyeOY, 9, 0, Math.PI * 2);
      ctx.arc(16 + eyeOX, -6 + eyeOY, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#0f172a';
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-16 + eyeOX * 1.3, -6 + eyeOY * 1.3, 4, 0, Math.PI * 2);
      ctx.arc(16 + eyeOX * 1.3, -6 + eyeOY * 1.3, 4, 0, Math.PI * 2);
      ctx.fill();

      // Naseaux & Anneau nasal doré
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(0, 26, 14, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();

      // Fumée naseaux animée
      if (Math.random() < 0.35) {
        nostrilPuffs.push({
          x: x - 18, y: y + 26,
          vx: -Math.random() * 2 - 1, vy: Math.random() * 2 - 1,
          size: 6, life: 1.0
        });
        nostrilPuffs.push({
          x: x + 18, y: y + 26,
          vx: Math.random() * 2 + 1, vy: Math.random() * 2 - 1,
          size: 6, life: 1.0
        });
      }

      ctx.restore();
    }

    // --- 4. LE BALLON REEL ---
    function renderBallReal(x, y) {
      ctx.save();
      ctx.translate(x, y);

      ctx.beginPath();
      ctx.arc(0, 4, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Pentagone central du ballon de foot
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i * 2 * Math.PI) / 5 - Math.PI / 2;
        const px = Math.cos(a) * 6;
        const py = Math.sin(a) * 6;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // --- 5. TRAJECTOIRE DE VISÉE REELLE ---
    function renderAimArrowReal(fromX, fromY, toX, toY) {
      const dx = toX - fromX;
      const dy = toY - fromY;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      const dotCount = 7;

      ctx.save();
      for (let i = 1; i <= dotCount; i++) {
        const t = i / (dotCount + 1);
        const px = fromX + Math.cos(angle) * (dist * t);
        const py = fromY + Math.sin(angle) * (dist * t);

        ctx.beginPath();
        ctx.arc(px, py + 3, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#0f172a';
        ctx.stroke();
      }
      ctx.restore();
    }

    // --- 6. HUD SUPÉRIEUR OFFICIEL ---
    function renderHUDReal(t) {
      ctx.save();
      // Badge Passes
      drawHUDCard(40, 50, 180, 68, 'PASSES', score.toString(), '#0f172a');
      // Badge Étoiles
      drawHUDCard(W / 2 - 90, 50, 180, 68, 'ÉTOILES', (450 + score * 2).toString(), '#f59e0b');
      // Badge Record
      drawHUDCard(W - 220, 50, 180, 68, 'RECORD', '42', '#0f172a');
      ctx.restore();
    }

    function drawHUDCard(x, y, w, h, label, val, valColor) {
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      roundRect(ctx, x, y, w, h, 16);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#64748b';
      ctx.font = '800 13px "Varela Round"';
      ctx.textAlign = 'left';
      ctx.fillText(label, x + 20, y + 26);

      ctx.fillStyle = valColor;
      ctx.font = '900 28px "Varela Round"';
      ctx.fillText(val, x + 20, y + 54);
    }

    // --- 7. OVERLAY HOOK [00:00 - 00:03] : VRAIE CARTE D'ACCUEIL ---
    function renderOverlayHook(t) {
      // Ombre d'assombrissement
      ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
      ctx.fillRect(0, 0, W, H);

      const cardW = 540;
      const cardH = 780;
      const cardX = (W - cardW) / 2;
      const cardY = 190;

      // Boîte modale officielle Playful Flat
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      roundRect(ctx, cardX, cardY, cardW, cardH, 28);
      ctx.fill();
      ctx.stroke();

      // Pill "Playful Flat Edition"
      ctx.fillStyle = '#fbbf24';
      roundRect(ctx, cardX + 160, cardY + 24, 220, 36, 18);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#0f172a';

    // --- 9. OVERLAY SHOP [00:08 - 00:12] : VRAIE BOUTIQUE RONDO RUSH ---

        roundRect(ctx, modalX + 50, cardItemY + 18, 110, 110, 16);
        ctx.fill();
        ctx.stroke();
        renderBullReal(modalX + 105, cardItemY + 73, false, sk.isMagma, t);

        // Nom

        ctx.font = '900 22px "Varela Round"';
        ctx.textAlign = 'left';
        ctx.fillText(sk.name, modalX + 185, cardItemY + 55);

        ctx.textAlign = 'center';
        ctx.fillText(sk.price, modalX + 295, cardItemY + 105);
      });

      // URL en bas
      ctx.fillStyle = '#ffffff';
      roundRect(ctx, 70, stickerY + 125, W - 140, 52, 14);

    // --- BANNIÈRE HAUTE DYNAMIQUE ---
    function renderTopBanner(text, bgColor, t, textColor = '#0f172a') {
      const pulse = 1.0 + Math.sin(t * 10) * 0.04;
      ctx.save();
      ctx.translate(W / 2, 135);
      ctx.scale(pulse, pulse);

      ctx.fillStyle = bgColor;
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      roundRect(ctx, -270, -38, 540, 76, 20);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = textColor;
      ctx.font = '900 25px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 0, 0);

      ctx.restore();
    }

    // Doigt virtuel stylisé Playful Flat
    function drawFinger(x, y, isPress) {
      ctx.save();
      ctx.translate(x, y);
      const sc = isPress ? 0.9 : 1.0;
      ctx.scale(sc, sc);

      // Ombre du pouce
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      roundRect(ctx, -24, 8, 48, 120, 24);
      ctx.fill();

      // Pouce
      ctx.fillStyle = '#fbcfe8';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 5;
      roundRect(ctx, -24, 0, 48, 120, 24);
      ctx.fill();
      ctx.stroke();

      // Ongle
      ctx.fillStyle = '#ffffff';
      roundRect(ctx, -14, 12, 28, 22, 8);
      ctx.fill();

      // Ondulation d'impact si pressé
      if (isPress) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 18, 42, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function renderPuffs() {
      for (let i = nostrilPuffs.length - 1; i >= 0; i--) {
        const p = nostrilPuffs[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) {
          nostrilPuffs.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.life * 0.7;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // --- MISE À JOUR PHYSIQUE ET PASSES RAPIDES ---
    function update(dt, t) {
      // Passes du gameplay [00:03 - 00:08]
      if (passIdx < PASSES.length) {
        const pEv = PASSES[passIdx];
        if (t >= pEv.aim && t < pEv.t) {
          isAiming = true;
          aimStart = { x: players[pEv.from].x, y: players[pEv.from].y };
          aimEnd = { x: players[pEv.to].x, y: players[pEv.to].y };
        } else {
          isAiming = false;
        }

        if (t >= pEv.t && !ball.inFlight) {
          ball.fromX = players[pEv.from].x;
          ball.fromY = players[pEv.from].y;
          ball.toX = players[pEv.to].x;
          ball.toY = players[pEv.to].y;
          ball.carrierIdx = pEv.to;
          ball.progress = 0;
          ball.inFlight = true;
          audio.playPass(score + 1);
        }
      }

      if (ball.inFlight) {
        ball.progress += 0.085;
        if (ball.progress >= 1.0) {
          ball.progress = 1.0;
          ball.inFlight = false;
          ball.x = ball.toX;
          ball.y = ball.toY;
          score += 4;
          screenShake = 16;
          passIdx++;
        } else {
          ball.x = ball.fromX + (ball.toX - ball.fromX) * ball.progress;
          ball.y = ball.fromY + (ball.toY - ball.fromY) * ball.progress;
        }
      }

      // Taureau qui accélère
      if (t >= 3.0 && t < 8.0) {
        const target = ball.inFlight ? ball : players[ball.carrierIdx];
        const spd = 0.09 + (t - 3.0) * 0.02;
        bull.x += (target.x - bull.x) * spd;
        bull.y += (target.y - bull.y) * spd;
        bull.isAngry = (t >= 5.0);
      }
    }

    // --- PIPELINE D'ENREGISTREMENT ---
    let currentPlayTime = 0;
    let mediaRecorder = null;
    let recordedChunks = [];

    async function startRecording() {
      audio.init();
      currentPlayTime = 0;
      passIdx = 0;
      score = 0;

      const videoStream = canvas.captureStream(60);
      const combinedTracks = [
        ...videoStream.getVideoTracks(),
        ...audio.audioStream.getAudioTracks()
      ];
      const combinedStream = new MediaStream(combinedTracks);

      let mimeType = 'video/webm;codecs=vp9,opus';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

      recordedChunks = [];
      mediaRecorder = new MediaRecorder(combinedStream, {
        mimeType: mimeType,
        videoBitsPerSecond: 8000000
      });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        blob.arrayBuffer().then(buf => {
          fetch('/save-video-15s', {
            method: 'POST',
            body: buf,
            headers: { 'Content-Type': 'application/octet-stream' }
          }).then(() => {
            statusLabel.innerHTML = 'Vidéo 15s capturée avec succès.';
          });
        });
      };

      mediaRecorder.start();

      let lastTime = performance.now();

      function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.04);
        lastTime = now;

        currentPlayTime += dt;
        audio.tick();
        update(dt, currentPlayTime);
        render(currentPlayTime);

        const progressPercent = Math.min((currentPlayTime / TOTAL_DURATION) * 100, 100);
        progressFill.style.width = `${progressPercent}%`;
        statusLabel.innerHTML = `Génération 15s : ${currentPlayTime.toFixed(1)}s / 15.0s`;

        if (currentPlayTime < TOTAL_DURATION) {
          requestAnimationFrame(loop);
        } else {
          mediaRecorder.stop();
        }
      }

      requestAnimationFrame(loop);
    }

    render(0);

    if (window.location.search.includes('auto=1')) {
      setTimeout(() => {
        startRecording();
      }, 500);
    }
  </script>
