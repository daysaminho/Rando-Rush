<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rondo Rush - Générateur Vidéo 20s (Format 9:16)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-ui: 'Varela Round', system-ui, sans-serif;
      --bg-dark: #090d16;
      --bg-card: #151d30;
      --border-color: #0f172a;
      --accent: #4ade80;
      --btn-chunky: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-ui);
    }

    body {
      background: var(--bg-dark);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .header-bar {
      margin-bottom: 12px;
      text-align: center;
    }

    .header-title {
      font-size: 20px;
      font-weight: 900;
      color: #4ade80;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Cadre 9:16 téléphone mobile pour prévisualisation */
    .preview-stage {
      position: relative;
      width: 360px;
      height: 640px;
      border-radius: 28px;
      border: 4px solid #0f172a;
      box-shadow: 0 10px 0 #020617, 0 20px 30px rgba(0, 0, 0, 0.6);
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #4ade80;
    }

    .control-panel {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 16px;
      border: 3px solid #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-record {
      background: #fbbf24;
      color: #0f172a;
      box-shadow: 0 5px 0 #0f172a;
    }
    .btn-record:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0f172a;
    }

    .btn-preview {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 5px 0 #0f172a;
    }
    .btn-preview:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0f172a;
    }

    .progress-bar-container {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 8px;
      border: 2px solid #0f172a;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #4ade80;
      transition: width 0.1s linear;
    }

    .status-text {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      text-align: center;
    }

    .status-highlight {
      color: #fbbf24;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">
      <span>RONDO RUSH - STUDIO PUB 9:16</span>
    </div>
    <div class="header-subtitle">Format TikTok / Reels / Shorts (1080 x 1920) - 20 Secondes</div>
  </div>

  <div class="preview-stage">
    <canvas id="trailerCanvas" width="720" height="1280"></canvas>
  </div>

  <div class="control-panel">
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="status-text" id="statusLabel">Prêt pour la génération de la vidéo (20s)</div>

    <div class="btn-row">
      <button class="btn-action btn-record" id="btnRecord">
        <span>Générer la vidéo (20s)</span>
      </button>
      <button class="btn-action btn-preview" id="btnPreview">
        <span>Aperçu</span>
      </button>
    </div>
  </div>

  <script>
    // Configuration Studio Vidéo
    const TOTAL_DURATION = 20.0; // 20.0 secondes pile
    const canvas = document.getElementById('trailerCanvas');
    const ctx = canvas.getContext('2d');
    const progressFill = document.getElementById('progressFill');
    const statusLabel = document.getElementById('statusLabel');
    const btnRecord = document.getElementById('btnRecord');
    const btnPreview = document.getElementById('btnPreview');

    const W = canvas.width;   // 720
    const H = canvas.height;  // 1280

    // Moteur Audio Synthétique compatible MediaStream
    class StudioAudio {
      constructor() {
        this.ctx = null;
        this.dest = null;
        this.audioStream = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.dest = this.ctx.createMediaStreamDestination();
          this.audioStream = this.dest.stream;
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, duration, type = 'sine', gain = 0.3) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(gain, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(g);
        g.connect(this.ctx.destination);
        g.connect(this.dest);

        osc.start(now);
        osc.stop(now + duration);
      }

      playPass(streak = 1) {
        const freqs = [330, 392, 440, 523, 587, 659, 784, 880];
        const f = freqs[(streak - 1) % freqs.length];
        this.playTone(f, 0.16, 'triangle', 0.35);
      }

      playCrossPass() {
        this.playTone(660, 0.08, 'square', 0.25);
        setTimeout(() => this.playTone(880, 0.18, 'triangle', 0.35), 70);
      }

      playWhistle() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(2600, now);
        osc.frequency.linearRampToValueAtTime(3200, now + 0.12);
        osc.frequency.setValueAtTime(2900, now + 0.16);
        osc.frequency.linearRampToValueAtTime(3400, now + 0.32);
        g.gain.setValueAtTime(0.18, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(g);
        g.connect(this.ctx.destination);
        g.connect(this.dest);

        osc.start(now);
        osc.stop(now + 0.35);
      }

      playBullRoar() {
        this.playTone(85, 0.45, 'sawtooth', 0.4);
      }

      playJingle() {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 0.25, 'triangle', 0.3), idx * 110);
        });
      }
    }

    const audio = new StudioAudio();

    // Entités visuelles du Rondo (5 passeurs, 1 taureau, 1 ballon)
    const centerX = W / 2;
    const centerY = H / 2 + 30;
    const rondoRadius = 240;

    let players = [];
    for (let i = 0; i < 5; i++) {
      const angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
      players.push({
        idx: i,
        angle: angle,
        x: centerX + Math.cos(angle) * rondoRadius,
        y: centerY + Math.sin(angle) * rondoRadius,
        radius: 36
      });
    }

    let bull = {
      x: centerX,
      y: centerY,
      vx: 0,
      vy: 0,
      targetX: centerX,
      targetY: centerY,
      radius: 46,
      angle: 0,
      isAngry: false
    };

    let ball = {
      x: players[0].x,
      y: players[0].y,
      carrierIdx: 0,
      inFlight: false,
      fromX: players[0].x,
      fromY: players[0].y,
      toX: players[0].x,
      toY: players[0].y,
      flightProgress: 1.0,
      radius: 18
    };

    let particles = [];
    let textToasts = [];

    function addToast(text, sub = '', isAlert = false) {
      textToasts.push({
        text,
        sub,
        isAlert,
        born: currentPlayTime,
        life: 1.3
      });
    }

    function addBurst(x, y, count = 12, color = '#fbbf24') {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 8 + 4;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          size: Math.random() * 7 + 4,
          color: color,
          alpha: 1.0,
          life: 0.7
        });
      }
    }

    // SCÉNARIO CHORÉGRAPHIÉ DE LA PUB (0.0s à 20.0s)
    let currentPlayTime = 0;
    let isRunning = false;
    let mediaRecorder = null;
    let recordedChunks = [];

    // Déroulé temporel exact des actions
    const PASS_EVENTS = [
      { t: 3.8, from: 0, to: 2, cross: true },
      { t: 4.8, from: 2, to: 4, cross: true },
      { t: 5.7, from: 4, to: 1, cross: true },
      { t: 6.6, from: 1, to: 3, cross: true },
      { t: 7.4, from: 3, to: 0, cross: true },
      { t: 8.2, from: 0, to: 2, cross: true, rage: true },
      { t: 8.9, from: 2, to: 4, cross: true },
      { t: 9.6, from: 4, to: 1, cross: true }
    ];

    let passedIndex = 0;
    let currentScore = 0;
    let currentSkinPitch = 'pitch_grass';
    let currentSkinBull = 'bull_classic';

    // Rendu graphique complet
    function render(t) {
      ctx.clearRect(0, 0, W, H);

      // Séquençage des 5 phases
      if (t < 3.2) {
        // --- PHASE 1 : INTRO ACCROCHE ULTRA DYNAMIQUE (0.0s - 3.2s) ---
        renderIntroHook(t);
      } else if (t < 10.2) {
        // --- PHASE 2 : GAMEPLAY FRÉNÉTIQUE & COMBOS (3.2s - 10.2s) ---
        renderGameplay(t, false);
      } else if (t < 15.5) {
        // --- PHASE 3 : SHOWCASE DE LA BOUTIQUE & 30 SKINS (10.2s - 15.5s) ---
        renderShopShowcase(t);
      } else if (t < 17.5) {
        // --- PHASE 4 : DÉMO DU NOUVEAU STYLE EN PLEIN JEU (15.5s - 17.5s) ---
        renderGameplay(t, true);
      } else {
        // --- PHASE 5 : CALL TO ACTION FINAL PERCUTANT (17.5s - 20.0s) ---
        renderOutroCTA(t);
      }

      // Rendu des particules et toasts
      renderFX();
    }

    // --- PHASE 1 : INTRO HOOK ---
    function renderIntroHook(t) {
      // Fond dynamique à rayures animées
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 40;
      const offset = (t * 120) % 80;
      for (let x = -W; x < W * 2; x += 80) {
        ctx.beginPath();
        ctx.moveTo(x + offset, 0);
        ctx.lineTo(x + offset + 200, H);
        ctx.stroke();
      }
      ctx.restore();

      // Badge du haut
      ctx.save();
      ctx.fillStyle = '#fbbf24';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 5;
      roundRect(ctx, W / 2 - 220, 160, 440, 56, 20);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 24px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('LE JEU DE FOOT QUI REND FOU !', W / 2, 188);
      ctx.restore();

      // Taureau géant animé au centre
      const bounce = Math.sin(t * 8) * 15;
      drawGiantBull(W / 2, H / 2 - 40 + bounce, t);

      // Titre RONDO RUSH
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '900 68px "Varela Round"';
      // Ombre portée
      ctx.fillStyle = '#020617';
      ctx.fillText('RONDO RUSH', W / 2 + 6, H / 2 + 186);
      // Texte principal
      ctx.fillStyle = '#4ade80';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 8;
      ctx.strokeText('RONDO RUSH', W / 2, H / 2 + 180);
      ctx.fillText('RONDO RUSH', W / 2, H / 2 + 180);
      ctx.restore();

      // Tagline
      ctx.save();
      ctx.font = '800 28px "Varela Round"';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText('1 TAUREAU. 5 PASSEURS.', W / 2, H / 2 + 250);
      ctx.fillStyle = '#fbbf24';
      ctx.fillText('SURVIVRAS-TU ?', W / 2, H / 2 + 295);
      ctx.restore();

      // Décompte 3.. 2.. 1.. GO !
      let countdown = '3';
      if (t > 1.0 && t <= 2.0) countdown = '2';
      else if (t > 2.0 && t <= 2.8) countdown = '1';
      else if (t > 2.8) countdown = 'PARTEZ !';

      ctx.save();
      ctx.fillStyle = countdown === 'PARTEZ !' ? '#4ade80' : '#ef4444';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      roundRect(ctx, W / 2 - 130, H - 240, 260, 80, 24);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 38px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(countdown, W / 2, H - 200);
      ctx.restore();
    }

    // Dessin du taureau géant intro
    function drawGiantBull(x, y, t) {
      ctx.save();
      ctx.translate(x, y);

      // Ombre au sol
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 130, 130, 35, 0, 0, Math.PI * 2);
      ctx.fill();

      // Corps
      ctx.fillStyle = '#fb7185';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(0, 0, 95, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Cornes dorées
      ctx.fillStyle = '#f59e0b';
      ctx.lineWidth = 6;
      // Corne Gauche
      ctx.beginPath();
      ctx.moveTo(-60, -50);
      ctx.quadraticCurveTo(-110, -110, -65, -145);
      ctx.quadraticCurveTo(-55, -95, -30, -75);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Corne Droite
      ctx.beginPath();
      ctx.moveTo(60, -50);
      ctx.quadraticCurveTo(110, -110, 65, -145);
      ctx.quadraticCurveTo(55, -95, 30, -75);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Yeux féroces
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-35, -15, 20, 0, Math.PI * 2);
      ctx.arc(35, -15, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-30, -15, 9, 0, Math.PI * 2);
      ctx.arc(30, -15, 9, 0, Math.PI * 2);
      ctx.fill();

      // Anneau nasal doré
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.arc(0, 55, 26, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();

      // Naseaux
      ctx.fillStyle = '#881337';
      ctx.beginPath();
      ctx.arc(-18, 38, 7, 0, Math.PI * 2);
      ctx.arc(18, 38, 7, 0, Math.PI * 2);
      ctx.fill();

      // Fumée naseaux animée
      const puffX = Math.sin(t * 15) * 6;
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(-55 + puffX, 42, 12, 0, Math.PI * 2);
      ctx.arc(55 - puffX, 42, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // --- PHASE 2 & 4 : GAMEPLAY (Herbe classique puis Cyber Tokyo) ---
    function renderGameplay(t, isCyber = false) {
      // 1. Fond du terrain
      if (!isCyber) {
        ctx.fillStyle = '#4ade80';
        ctx.fillRect(0, 0, W, H);

        // Lignes du terrain de foot
        ctx.strokeStyle = '#bbf7d0';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(centerX, centerY, rondoRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        // Néo Tokyo Cyberpunk
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(0, 0, W, H);

        // Grille néon violette
        ctx.strokeStyle = '#4338ca';
        ctx.lineWidth = 3;
        for (let y = 0; y < H; y += 60) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
        for (let x = 0; x < W; x += 60) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }

        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(centerX, centerY, rondoRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = '#38bdf8';
        ctx.strokeRect(centerX - 100, centerY - 100, 200, 200);
      }

      // HUD supérieur de la vidéo (Score, Étoiles, Record)
      renderTopHUD(t, isCyber);

      // Bandeau d'animation en haut
      ctx.save();
      ctx.fillStyle = isCyber ? '#a855f7' : '#fbbf24';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      roundRect(ctx, W / 2 - 200, 180, 400, 52, 16);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 20px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (!isCyber) {
        ctx.fillText(bull.isAngry ? 'FUREUR : LE TAUREAU ACCÉLÈRE !' : 'ENCHAÎNE LES PASSES DIRECTES !', W / 2, 206);
      } else {
        ctx.fillText('NOUVEAU STYLE ÉQUIPÉ EN DIRECT !', W / 2, 206);
      }
      ctx.restore();

      // Dessin des 5 joueurs (Bleu ciel ou Néon)
      players.forEach((p, idx) => {
        const isCarrier = (idx === ball.carrierIdx && !ball.inFlight);
        drawPlayer(p.x, p.y, isCarrier, isCyber);
      });

      // Dessin du taureau (Normal ou Cyber Bot)
      drawInGameBull(bull.x, bull.y, bull.isAngry, isCyber);

      // Trajectoire en vol du ballon
      if (ball.inFlight) {
        ctx.save();
        ctx.strokeStyle = isCyber ? '#38bdf8' : '#fef08a';
        ctx.lineWidth = 8;
        ctx.setLineDash([12, 10]);
        ctx.beginPath();
        ctx.moveTo(ball.fromX, ball.fromY);
        ctx.lineTo(ball.x, ball.y);
        ctx.stroke();
        ctx.restore();
      }

      // Ballon
      drawBall(ball.x, ball.y);

      // Toast bas de gameplay (ex: SUPER PASSE +1)
      if (ball.inFlight) {
        ctx.save();
        ctx.fillStyle = '#fbbf24';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        roundRect(ctx, W / 2 - 140, H - 180, 280, 52, 16);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#0f172a';
        ctx.font = '900 20px "Varela Round"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('SUPER PASSE +1 !', W / 2, H - 154);
        ctx.restore();
      }
    }

    // Dessin Joueur
    function drawPlayer(x, y, isCarrier, isCyber) {
      ctx.save();
      ctx.translate(x, y);

      // Ombre
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 32, 26, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Cercle de sélection actif
      if (isCarrier) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, 48, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Corps joueur
      ctx.fillStyle = isCyber ? '#38bdf8' : '#38bdf8';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Numéro / Motif maillot
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 20px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('10', 0, 2);

      ctx.restore();
    }

    // Dessin Taureau en jeu
    function drawInGameBull(x, y, isAngry, isCyber) {
      ctx.save();
      ctx.translate(x, y);

      // Ombre
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 42, 36, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Corps
      ctx.fillStyle = isCyber ? '#0284c7' : (isAngry ? '#dc2626' : '#fb7185');
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, 44, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Cornes
      ctx.fillStyle = isCyber ? '#38bdf8' : (isAngry ? '#ef4444' : '#f59e0b');
      ctx.lineWidth = 4;
      // Corne Gauche
      ctx.beginPath();
      ctx.moveTo(-28, -20);
      ctx.quadraticCurveTo(-50, -50, -30, -68);
      ctx.quadraticCurveTo(-24, -45, -12, -35);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Corne Droite
      ctx.beginPath();
      ctx.moveTo(28, -20);
      ctx.quadraticCurveTo(50, -50, 30, -68);
      ctx.quadraticCurveTo(24, -45, 12, -35);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Yeux
      ctx.fillStyle = isAngry || isCyber ? '#fef08a' : '#ffffff';
      ctx.beginPath();
      ctx.arc(-16, -6, 9, 0, Math.PI * 2);
      ctx.arc(16, -6, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-14, -6, 4, 0, Math.PI * 2);
      ctx.arc(14, -6, 4, 0, Math.PI * 2);
      ctx.fill();

      // Anneau
      ctx.strokeStyle = isCyber ? '#38bdf8' : '#f59e0b';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 25, 12, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    // Dessin Ballon
    function drawBall(x, y) {
      ctx.save();
      ctx.translate(x, y);

      // Ombre
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 16, 14, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Motif ballon de foot
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // Top HUD
    function renderTopHUD(t, isCyber) {
      ctx.save();
      // Badge Passes
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      roundRect(ctx, 40, 60, 180, 70, 18);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#64748b';
      ctx.font = '800 13px "Varela Round"';
      ctx.fillText('PASSES', 65, 84);
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 30px "Varela Round"';
      ctx.fillText(currentScore.toString(), 65, 116);

      // Badge Étoiles
      roundRect(ctx, W / 2 - 90, 60, 180, 70, 18);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#f59e0b';
      ctx.font = '800 13px "Varela Round"';
      ctx.fillText('ÉTOILES', W / 2 - 65, 84);
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 30px "Varela Round"';
      ctx.fillText((currentScore * 5).toString(), W / 2 - 65, 116);

      // Badge Record
      roundRect(ctx, W - 220, 60, 180, 70, 18);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#64748b';
      ctx.font = '800 13px "Varela Round"';
      ctx.fillText('RECORD', W - 195, 84);
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 30px "Varela Round"';
      ctx.fillText('42', W - 195, 116);
      ctx.restore();
    }

    // --- PHASE 3 : SHOWCASE DE LA BOUTIQUE (10.2s - 15.5s) ---
    function renderShopShowcase(t) {
      // Fond sombre tamisé
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, W, H);

      // Titre Boutique
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fbbf24';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      ctx.font = '900 42px "Varela Round"';
      ctx.strokeText('BOUTIQUE OFFICIELLE', W / 2, 120);
      ctx.fillText('BOUTIQUE OFFICIELLE', W / 2, 120);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 24px "Varela Round"';
      ctx.fillText('30 SKINS 100% GRATUITS', W / 2, 165);
      ctx.restore();

      // Onglets
      const tabs = ['TAUREAUX', 'MAILLOTS', 'TERRAINS'];
      const activeTabIdx = t < 12.0 ? 0 : (t < 13.8 ? 1 : 2);

      tabs.forEach((tab, i) => {
        const tabX = 60 + i * 205;
        const isActive = (i === activeTabIdx);
        ctx.save();
        ctx.fillStyle = isActive ? '#fbbf24' : '#1e293b';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        roundRect(ctx, tabX, 205, 190, 52, 14);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = isActive ? '#0f172a' : '#94a3b8';
        ctx.font = '900 16px "Varela Round"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tab, tabX + 95, 231);
        ctx.restore();
      });

      // Grille de cartes de skins présentés
      const cards = [
        { name: 'TAUREAU NINJA', desc: 'Furtif & Sombre', price: 'DÉBLOQUÉ', color: '#1e293b', isEquipped: false },
        { name: 'CYBER BOT 3000', desc: 'Cornes Laser', price: 'ÉQUIPÉ !', color: '#0284c7', isEquipped: true },
        { name: 'TAUREAU DORÉ', desc: 'Légende Royale', price: '100 ÉTOILES', color: '#f59e0b', isEquipped: false },
        { name: 'NÉO TOKYO', desc: 'Terrain Cyber Grid', price: 'ÉQUIPÉ !', color: '#6366f1', isEquipped: true }
      ];

      cards.forEach((c, idx) => {
        const row = Math.floor(idx / 2);
        const col = idx % 2;
        const cardX = 60 + col * 310;
        const cardY = 290 + row * 340;

        ctx.save();
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = c.isEquipped ? '#fbbf24' : '#0f172a';
        ctx.lineWidth = c.isEquipped ? 6 : 4;
        roundRect(ctx, cardX, cardY, 290, 310, 22);
        ctx.fill();
        ctx.stroke();

        // Zone visuelle
        ctx.fillStyle = c.color;
        roundRect(ctx, cardX + 15, cardY + 15, 260, 160, 16);
        ctx.fill();
        ctx.stroke();

        // Symbole / Aperçu
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 20px "Varela Round"';
        ctx.textAlign = 'center';
        ctx.fillText(c.name, cardX + 145, cardY + 215);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '700 14px "Varela Round"';
        ctx.fillText(c.desc, cardX + 145, cardY + 242);

        // Bouton ÉQUIPER / ÉQUIPÉ
        ctx.fillStyle = c.isEquipped ? '#4ade80' : '#fbbf24';
        roundRect(ctx, cardX + 30, cardY + 258, 230, 42, 12);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#0f172a';
        ctx.font = '900 16px "Varela Round"';
        ctx.fillText(c.price, cardX + 145, cardY + 280);

        ctx.restore();
      });

      // Bannière dynamique en bas
      ctx.save();
      ctx.fillStyle = '#4ade80';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 5;
      roundRect(ctx, 60, H - 240, W - 120, 120, 24);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.font = '900 28px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.fillText('NOUVEAU SKIN DÉBLOQUÉ !', W / 2, H - 190);
      ctx.font = '800 20px "Varela Round"';
      ctx.fillText('RETOUR SUR LE TERRAIN IMMÉDIAT !', W / 2, H - 150);
      ctx.restore();
    }

    // --- PHASE 5 : OUTRO CALL TO ACTION (17.5s - 20.0s) ---
    function renderOutroCTA(t) {
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, W, H);

      // Rayons de soleil tournants en fond
      ctx.save();
      ctx.translate(W / 2, H / 2 - 120);
      const rot = (t - 17.5) * 1.5;
      ctx.rotate(rot);
      for (let i = 0; i < 16; i++) {
        ctx.fillStyle = (i % 2 === 0) ? 'rgba(74, 222, 128, 0.08)' : 'transparent';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, 900, (i * Math.PI) / 8, ((i + 1) * Math.PI) / 8);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Taureau triomphant
      drawGiantBull(W / 2, H / 2 - 200, t);

      // Titre RONDO RUSH
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '900 72px "Varela Round"';
      ctx.fillStyle = '#020617';
      ctx.fillText('RONDO RUSH', W / 2 + 6, H / 2 + 26);
      ctx.fillStyle = '#4ade80';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 8;
      ctx.strokeText('RONDO RUSH', W / 2, H / 2 + 20);
      ctx.fillText('RONDO RUSH', W / 2, H / 2 + 20);
      ctx.restore();

      // Badges arguments
      const args = [
        '100% GRATUIT SUR NAVIGATEUR',
        'ZÉRO TÉLÉCHARGEMENT REQUIS',
        'IPHONE, ANDROID & PC'
      ];

      args.forEach((arg, i) => {
        ctx.save();
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        roundRect(ctx, W / 2 - 240, H / 2 + 75 + i * 62, 480, 50, 16);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 18px "Varela Round"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(arg, W / 2, H / 2 + 100 + i * 62);
        ctx.restore();
      });

      // GROS BOUTON CTA "JOUER MAINTENANT" PULSANT
      const pulse = 1.0 + Math.sin(t * 10) * 0.04;
      ctx.save();
      ctx.translate(W / 2, H - 240);
      ctx.scale(pulse, pulse);

      ctx.fillStyle = '#fbbf24';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 6;
      roundRect(ctx, -240, -45, 480, 90, 26);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.font = '900 34px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('JOUER MAINTENANT', 0, 0);
      ctx.restore();

      // Lien Web & Bio
      ctx.save();
      ctx.fillStyle = '#94a3b8';
      ctx.font = '800 22px "Varela Round"';
      ctx.textAlign = 'center';
      ctx.fillText('LIEN EN BIO OU SUR :', W / 2, H - 120);
      ctx.fillStyle = '#4ade80';
      ctx.font = '900 26px "Varela Round"';
      ctx.fillText('rando-rush.onrender.com', W / 2, H - 80);
      ctx.restore();
    }

    // Gestion des particules et effets
    function renderFX() {
      // Particules
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.025;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Mise à jour de la physique et des événements
    function update(dt) {
      currentPlayTime += dt;

      // Traitement des passes programmées
      if (passedIndex < PASS_EVENTS.length) {
        const ev = PASS_EVENTS[passedIndex];
        if (currentPlayTime >= ev.t) {
          triggerPass(ev);
          passedIndex++;
        }
      }

      // Ballon en vol
      if (ball.inFlight) {
        ball.flightProgress += dt * 3.5;
        if (ball.flightProgress >= 1.0) {
          ball.flightProgress = 1.0;
          ball.inFlight = false;
          ball.carrierIdx = ball.targetIdx;
          ball.x = players[ball.carrierIdx].x;
          ball.y = players[ball.carrierIdx].y;
          currentScore++;
          audio.playPass(currentScore);
          addBurst(ball.x, ball.y, 14, '#fbbf24');
        } else {
          ball.x = ball.fromX + (ball.toX - ball.fromX) * ball.flightProgress;
          ball.y = ball.fromY + (ball.toY - ball.fromY) * ball.flightProgress;
        }
      }

      // Taureau qui chasse
      const target = ball.inFlight ? ball : players[ball.carrierIdx];
      const dx = target.x - bull.x;
      const dy = target.y - bull.y;
      const dist = Math.hypot(dx, dy);
      const speed = bull.isAngry ? 260 : 180;
      if (dist > 8) {
        bull.x += (dx / dist) * speed * dt;
        bull.y += (dy / dist) * speed * dt;
      }
    }

    function triggerPass(ev) {
      ball.fromX = players[ev.from].x;
      ball.fromY = players[ev.from].y;
      ball.toX = players[ev.to].x;
      ball.toY = players[ev.to].y;
      ball.targetIdx = ev.to;
      ball.flightProgress = 0;
      ball.inFlight = true;

      if (ev.cross) {
        audio.playCrossPass();
        addToast('SUPER PASSE +1 !', '', true);
      }
      if (ev.rage) {
        bull.isAngry = true;
        audio.playBullRoar();
      }
    }

    // Outil rectangle arrondi
    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // Réinitialisation de la simulation
    function resetTimeline() {
      currentPlayTime = 0;
      passedIndex = 0;
      currentScore = 0;
      bull.isAngry = false;
      bull.x = centerX;
      bull.y = centerY;
      ball.carrierIdx = 0;
      ball.inFlight = false;
      ball.x = players[0].x;
      ball.y = players[0].y;
      particles = [];
      textToasts = [];
    }

    // Moteur d'enregistrement MediaRecorder
    async function startRecording() {
      audio.init();
      resetTimeline();
      isRunning = true;
      btnRecord.disabled = true;
      btnPreview.disabled = true;

      statusLabel.innerHTML = 'Enregistrement en cours : <span class="status-highlight">0.0s / 20.0s</span>';

      // Capture vidéo 60 FPS du canvas
      const videoStream = canvas.captureStream(60);

      // Fusion avec la piste audio
      const combinedTracks = [
        ...videoStream.getVideoTracks(),
        ...audio.audioStream.getAudioTracks()
      ];
      const combinedStream = new MediaStream(combinedTracks);

      // Sélection du meilleur codec vidéo disponible
      let mimeType = 'video/mp4;codecs=avc1,mp4a';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = 'video/webm;codecs=vp9,opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/webm';
        }
      }

      recordedChunks = [];
      try {
        mediaRecorder = new MediaRecorder(combinedStream, {
          mimeType: mimeType,
          videoBitsPerSecond: 6000000 // 6 Mbps pour une netteté cristalline
        });
      } catch (err) {
        mediaRecorder = new MediaRecorder(combinedStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        const isMp4 = mimeType.includes('mp4');
        const extension = isMp4 ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type: isMp4 ? 'video/mp4' : 'video/webm' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `rondo-rush-pub-9-16-20s.${extension}`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);

        statusLabel.innerHTML = `Vidéo générée avec succès : <span class="status-highlight">rondo-rush-pub-9-16-20s.${extension}</span>`;
        btnRecord.disabled = false;
        btnPreview.disabled = false;

        if (window.location.search.includes('auto=1')) {
          blob.arrayBuffer().then(buf => {
            fetch('/save-video?ext=' + extension, {
              method: 'POST',
              body: buf,
              headers: { 'Content-Type': 'application/octet-stream' }
            }).then(() => {
              statusLabel.innerHTML = 'Fichier sauvegardé avec succès sur le disque.';
            });
          });
        }
      };

      mediaRecorder.start();

      // Boucle à pas fixe 60 FPS pour un rendu parfait sans saccade
      let lastTime = performance.now();
      audio.playWhistle();

      function recordLoop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        update(dt);
        render(currentPlayTime);

        const progressPercent = Math.min((currentPlayTime / TOTAL_DURATION) * 100, 100);
        progressFill.style.width = `${progressPercent}%`;
        statusLabel.innerHTML = `Enregistrement en cours : <span class="status-highlight">${currentPlayTime.toFixed(1)}s / 20.0s</span>`;

        if (currentPlayTime < TOTAL_DURATION) {
          requestAnimationFrame(recordLoop);
        } else {
          isRunning = false;
          mediaRecorder.stop();
        }
      }

      requestAnimationFrame(recordLoop);
    }

    // Prévisualisation simple sans enregistrement
    function startPreview() {
      audio.init();
      resetTimeline();
      isRunning = true;
      btnRecord.disabled = true;
      btnPreview.disabled = true;
      audio.playWhistle();

      let lastTime = performance.now();

      function previewLoop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        update(dt);
        render(currentPlayTime);

        const progressPercent = Math.min((currentPlayTime / TOTAL_DURATION) * 100, 100);
        progressFill.style.width = `${progressPercent}%`;
        statusLabel.innerHTML = `Aperçu : <span class="status-highlight">${currentPlayTime.toFixed(1)}s / 20.0s</span>`;

        if (currentPlayTime < TOTAL_DURATION) {
          requestAnimationFrame(previewLoop);
        } else {
          isRunning = false;
          statusLabel.innerHTML = 'Aperçu terminé.';
          btnRecord.disabled = false;
          btnPreview.disabled = false;
        }
      }

      requestAnimationFrame(previewLoop);
    }

    btnRecord.addEventListener('click', startRecording);
    btnPreview.addEventListener('click', startPreview);

    // Rendu initial de l'image de garde
    render(0);

    if (window.location.search.includes('auto=1')) {
      setTimeout(() => {
        startRecording();
      }, 700);
    }
  </script>
