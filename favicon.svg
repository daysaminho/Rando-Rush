<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background Squircle Playful Flat -->
  <rect x="24" y="24" width="464" height="464" rx="120" ry="120" fill="#4ade80" stroke="#0f172a" stroke-width="20" />
  
  <!-- Hard Shadow behind the Bull -->
  <ellipse cx="256" cy="425" rx="160" ry="32" fill="#166534" />
  
  <!-- Horns (Behind Head) -->
  <!-- Left Horn -->
  <path d="M 155 210 C 90 190 70 100 120 70 C 145 120 185 160 205 185 Z" fill="#fbbf24" stroke="#0f172a" stroke-width="18" stroke-linejoin="round" />
  <!-- Right Horn -->
  <path d="M 357 210 C 422 190 442 100 392 70 C 367 120 327 160 307 185 Z" fill="#fbbf24" stroke="#0f172a" stroke-width="18" stroke-linejoin="round" />
  
  <!-- Ears -->
  <ellipse cx="120" cy="250" rx="36" ry="20" transform="rotate(-25 120 250)" fill="#f43f5e" stroke="#0f172a" stroke-width="16" />
  <ellipse cx="392" cy="250" rx="36" ry="20" transform="rotate(25 392 250)" fill="#f43f5e" stroke="#0f172a" stroke-width="16" />

  <!-- Head / Body -->
  <circle cx="256" cy="265" r="145" fill="#fb7185" stroke="#0f172a" stroke-width="20" />
  
  <!-- Angry / Funny Eyebrows -->
  <path d="M 165 195 L 235 220" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <path d="M 347 195 L 277 220" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <!-- Eyes -->
  <circle cx="205" cy="235" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="14" />
  <circle cx="213" cy="235" r="13" fill="#0f172a" />
  <circle cx="217" cy="231" r="4" fill="#ffffff" />
  
  <circle cx="307" cy="235" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="14" />
  <circle cx="299" cy="235" r="13" fill="#0f172a" />
  <circle cx="295" cy="231" r="4" fill="#ffffff" />

  <!-- Snout / Nose -->
  <ellipse cx="256" cy="325" rx="80" ry="50" fill="#f43f5e" stroke="#0f172a" stroke-width="16" />
  
  <!-- Nostrils -->
  <circle cx="225" cy="318" r="12" fill="#0f172a" />
  <circle cx="287" cy="318" r="12" fill="#0f172a" />

  <!-- Golden Septum Nose Ring -->
  <path d="M 230 345 C 230 395 282 395 282 345" fill="none" stroke="#fbbf24" stroke-width="18" stroke-linecap="round" />
  <path d="M 230 345 C 230 395 282 395 282 345" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
</svg>
